name: Build and publish ResearchTools Setup
on:
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'src/taskpane/mcp-research-assistant.js'
      - 'tests/mcp-cloud-provider-routing.test.cjs'
      - 'tests/mcp-research-ui-placement.test.cjs'
      - '.github/workflows/build-researchtools-setup.yml'
  pull_request:
    branches: [main]
    paths:
      - 'installer/**'
      - 'src/taskpane/mcp-research-assistant.js'
      - 'tests/mcp-cloud-provider-routing.test.cjs'
      - 'tests/mcp-research-ui-placement.test.cjs'
      - '.github/workflows/build-researchtools-setup.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Build Word add-in
        run: npm run build
      - name: Validate Word manifest and cloud-only installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$manifest = Get-Content 'installer/Word-AI-Assistant.xml' -Raw
          $id = $manifest.SelectSingleNode("//*[local-name()='Id']")
          $source = $manifest.SelectSingleNode("//*[local-name()='DefaultSettings']/*[local-name()='SourceLocation']")
          if (-not $id -or $id.InnerText -ne 'f8a582b1-eaf2-44f9-8166-d034255586ad') { throw 'Invalid Word add-in ID.' }
          if (-not $source -or $source.GetAttribute('DefaultValue') -ne 'https://moh1983taher-ai.github.io/Word-AI-Assistant/taskpane.html') { throw 'Invalid production task pane URL.' }
          $iss = Get-Content 'installer/ResearchToolsSetup.iss' -Raw
          if ($iss -match 'DuckAI-Runtime|ResearchTools-MCP-Host|RuntimeArchive|McpHostArchive|ResearchTools-Launcher') { throw 'Installer still packages local research runtimes.' }
          if ($iss -notmatch 'Install-ResearchTools\.ps1' -or $iss -notmatch 'Word-AI-Assistant\.xml') { throw 'Missing Word add-in setup inputs.' }
          $install = Get-Content 'installer/Install-ResearchTools.ps1' -Raw
          if ($install -match 'RuntimeArchive|McpHostArchive|Start-McpHost|duck2api-main\.exe') { throw 'Installer still deploys the local MCP stack.' }
          if ($install -notmatch 'Unregister-ScheduledTask' -or $install -notmatch 'Remove-LegacyLocalMcpServices') { throw 'Legacy runtime cleanup is missing.' }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('installer/Install-ResearchTools.ps1',[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; throw 'Installer PowerShell syntax validation failed.' }
          Write-Host 'Cloud-only installer inputs and cleanup script validated.'
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $pf86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $compiler = Join-Path $pf86 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed: $LASTEXITCODE" }
          }
          $compiler = Join-Path $pf86 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler unavailable.' }
          & $compiler 'installer/ResearchToolsSetup.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed: $LASTEXITCODE" }
          $setup = 'dist/ResearchTools-Setup.exe'
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw 'Setup EXE was not generated.' }
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath ($setup + '.sha256') -Value ($hash + '  ResearchTools-Setup.exe') -Encoding ASCII
      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResearchTools-Setup-cloud-only
          path: |
            dist/ResearchTools-Setup.exe
            dist/ResearchTools-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish setup release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'researchtools-setup-v1.3.0'
          $title = 'ResearchTools Cloud-only Setup v1.3.0'
          $notes = @'
          يثبت هذا الإصدار إضافة Word وكتالوج Office الموثوق فقط.
          أزيل محرك DuckAI المحلي ومضيف MCP والجسر ومشغّل الخلفية ومهام التشغيل التلقائي من حزمة التثبيت.
          عند التثبيت، تزال آثار المكونات المحلية القديمة التي أنشأتها الإصدارات السابقة، مع الحفاظ على ملفات الإضافة ومحادثاتها وكتالوج Word.
          يستمر البحث في الجامع والمكتبة الشاملة عبر خادمي MCP السحابيين باستخدام Groq أو Gemini.
          لا يغيّر هذا الإصدار ملفات التطوير في C:\Word AI Assistant v2.
          '@
          Set-Content -LiteralPath 'release-notes.txt' -Value $notes -Encoding UTF8
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/ResearchTools-Setup.exe dist/ResearchTools-Setup.exe.sha256 --repo "$env:GITHUB_REPOSITORY" --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
            gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes-file 'release-notes.txt' --latest
          } else {
            gh release create $tag dist/ResearchTools-Setup.exe dist/ResearchTools-Setup.exe.sha256 --repo "$env:GITHUB_REPOSITORY" --title $title --notes-file 'release-notes.txt' --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
