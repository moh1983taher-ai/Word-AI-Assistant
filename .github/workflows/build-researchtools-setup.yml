name: Build and publish ResearchTools Setup

on:
  push:
    branches: [main, feature/mcp-host-dotnet10, feat/unified-local-mcp-host-20261121]
    paths:
      - 'installer/**'
      - 'runtime/McpHost/**'
      - 'runtime/ResearchTools-Launcher.vbs'
      - '.github/workflows/build-researchtools-setup.yml'
  pull_request:
    branches: [main]
    paths:
      - 'installer/**'
      - 'runtime/McpHost/**'
      - 'runtime/ResearchTools-Launcher.vbs'
      - '.github/workflows/build-researchtools-setup.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: researchtools-unified-setup
  cancel-in-progress: false

jobs:
  build-setup:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Windows PowerShell and manifest
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'installer/Install-ResearchTools.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error ('{0}:{1}: {2}' -f $path, $_.Extent.StartLineNumber, $_.Message) }
            throw 'PowerShell 5.1 parser validation failed.'
          }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path))
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) { throw 'UTF-8 BOM missing.' }
          [xml]$manifest = Get-Content 'installer/Word-AI-Assistant.xml' -Raw
          $id = $manifest.SelectSingleNode("//*[local-name()='Id']")
          $source = $manifest.SelectSingleNode("//*[local-name()='DefaultSettings']/*[local-name()='SourceLocation']")
          if (-not $id -or $id.InnerText -ne 'f8a582b1-eaf2-44f9-8166-d034255586ad') { throw 'Invalid Word add-in ID.' }
          if (-not $source -or $source.GetAttribute('DefaultValue') -ne 'https://moh1983taher-ai.github.io/Word-AI-Assistant/taskpane.html') { throw 'Invalid production task pane URL.' }
          if ((Get-Content 'installer/Word-AI-Assistant.xml' -Raw) -match 'localhost:3000') { throw 'Production manifest has a localhost URL.' }
          $launcher = Get-Content 'installer/ResearchTools-Launcher.vbs' -Raw
          if ($launcher -notmatch 'RESEARCHTOOLS_MCPHOST_V1' -or $launcher -notmatch 'McpHost\\ResearchTools\.McpHost\.exe') { throw 'Unified launcher is missing MCP host integration.' }
          $iss = Get-Content 'installer/ResearchToolsSetup.iss' -Raw
          $hostProject = Get-Content 'runtime/McpHost/ResearchTools.McpHost.csproj' -Raw
          $hostVersionMatch = [regex]::Match($hostProject, '(?s)<Version>(?<version>\d+\.\d+\.\d+)</Version>')
          $setupVersionMatch = [regex]::Match($iss, '(?m)^#define\s+AppVersion\s+"(?<version>[^"]+)"')
          $releaseWorkflowText = Get-Content '.github/workflows/build-researchtools-setup.yml' -Raw
          $releaseVersionLine = $releaseWorkflowText -split '\r?\n' |
            Where-Object { $_ -match '^\s*\$releaseVersion\s*=' } |
            Select-Object -First 1
          $workflowVersionMatch = [regex]::Match(
            [string]$releaseVersionLine,
            "(?m)^\s*`$releaseVersion\s*=\s*'(?<version>\d+\.\d+\.\d+)'\s*$")
          if (-not $hostVersionMatch.Success -or -not $setupVersionMatch.Success -or -not $workflowVersionMatch.Success) {
            throw 'Could not read MCP host, Inno Setup and release workflow versions.'
          }
          $hostVersion = $hostVersionMatch.Groups['version'].Value
          $setupVersion = $setupVersionMatch.Groups['version'].Value
          $workflowVersion = $workflowVersionMatch.Groups['version'].Value
          if ($hostVersion -ne $setupVersion -or $hostVersion -ne $workflowVersion) {
            throw "Version mismatch: MCP host=$hostVersion; Setup=$setupVersion; release=$workflowVersion."
          }
          Write-Host "MCP host, Setup executable and release tag are aligned at v$hostVersion."
          foreach ($required in @('ResearchTools-MCP-Host-release.zip','ResearchTools-Launcher.vbs','-McpHostArchive','-McpHostShaFile','-LauncherFile')) {
            if ($iss -notmatch [regex]::Escape($required)) { throw "Setup script does not embed $required." }
          }
          # Regression contract: the installer and Setup packager must require the
          # exact same MCP archive entries, and the ZIP entry count must derive
          # from that list rather than a stale hard-coded number.
          $installerScript = Get-Content 'installer/Install-ResearchTools.ps1' -Raw
          $installerFilesMatch = [regex]::Match(
            $installerScript,
            '(?s)\$requiredMcpFiles\s*=\s*@\((?<files>.*?)\)')
          if (-not $installerFilesMatch.Success) {
            throw 'Installer does not declare the required MCP archive file list.'
          }
          $installerFiles = @([regex]::Matches(
            $installerFilesMatch.Groups['files'].Value,
            "'([^']+)'") | ForEach-Object { $_.Groups[1].Value })

          $setupWorkflow = Get-Content '.github/workflows/build-researchtools-setup.yml' -Raw
          $packageFilesMatch = [regex]::Match(
            $setupWorkflow,
            '(?s)\$requiredEntries\s*=\s*@\((?<files>.*?)\)')
          if (-not $packageFilesMatch.Success) {
            throw 'Setup workflow does not declare the MCP package entry list.'
          }
          $packageFiles = @([regex]::Matches(
            $packageFilesMatch.Groups['files'].Value,
            "'([^']+)'") | ForEach-Object { $_.Groups[1].Value })

          $expectedMcpFiles = @(
            'ResearchTools.McpHost.exe',
            'ResearchTools.McpHost.exe.sha256',
            'Test-McpHost-Preview.ps1',
            'Start-McpHost-Preview.ps1'
          )
          if (@(Compare-Object $expectedMcpFiles $installerFiles).Count -gt 0) {
            throw 'Installer MCP archive file list differs from the four required package files.'
          }
          if (@(Compare-Object $expectedMcpFiles $packageFiles).Count -gt 0) {
            throw 'Setup package MCP archive file list differs from the four required package files.'
          }
          if ($installerScript -notmatch '(?s)\$zip\.Entries\.Count\s*-ne\s*\$requiredMcpFiles\.Count') {
            throw 'Installer MCP archive entry count is not derived from requiredMcpFiles.Count.'
          }

          Write-Host 'PowerShell 5.1, Word manifest, unified launcher, Setup inputs and MCP archive contract validated.'

      - name: Download and verify embedded runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          gh release download duckai-runtime-v1.0.6 --repo "$env:GITHUB_REPOSITORY" --pattern "DuckAI-Runtime-release.zip" --dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Runtime download failed.' }
          gh release download duckai-runtime-v1.0.6 --repo "$env:GITHUB_REPOSITORY" --pattern "DuckAI-Runtime-release.zip.sha256" --dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Runtime checksum download failed.' }
          $sidecar = Get-Content 'dist/DuckAI-Runtime-release.zip.sha256' -Raw
          if ($sidecar -notmatch '(?i)^\s*([a-f0-9]{64})\s+DuckAI-Runtime-release\.zip\s*$') { throw 'Invalid runtime checksum file.' }
          $expected = $matches[1].ToUpperInvariant()
          $actual = (Get-FileHash 'dist/DuckAI-Runtime-release.zip' -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actual -ne $expected) { throw 'Embedded runtime SHA-256 mismatch.' }
          Write-Host "Runtime verified: $actual"

      - name: Validate DuckAI bootstrap pin across bundled components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $stage = 'dist/runtime-pin-check'
          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          try {
            [IO.Compression.ZipFile]::ExtractToDirectory('dist/DuckAI-Runtime-release.zip', $stage)
            $bootstrap = Join-Path $stage 'DuckAI-Bootstrap.ps1'
            $runtimeLauncher = Join-Path $stage 'ResearchTools-Launcher.vbs'
            if (-not (Test-Path -LiteralPath $bootstrap -PathType Leaf) -or -not (Test-Path -LiteralPath $runtimeLauncher -PathType Leaf)) {
              throw 'Bundled DuckAI package is missing its bootstrap or launcher.'
            }
            $actualHash = (Get-FileHash -LiteralPath $bootstrap -Algorithm SHA256).Hash.ToLowerInvariant()
            $pattern = 'Const\s+BOOTSTRAP_SHA256\s*=\s*"([a-f0-9]{64})"'
            $runtimePin = [regex]::Match((Get-Content -LiteralPath $runtimeLauncher -Raw), $pattern)
            $unifiedPin = [regex]::Match((Get-Content -LiteralPath 'installer/ResearchTools-Launcher.vbs' -Raw), $pattern)
            if (-not $runtimePin.Success) { throw 'Could not read the bootstrap pin from the bundled DuckAI launcher.' }
            if (-not $unifiedPin.Success) { throw 'Could not read the bootstrap pin from the unified launcher.' }
            if ($runtimePin.Groups[1].Value.ToLowerInvariant() -ne $actualHash) {
              throw ('Bundled DuckAI launcher pin mismatch. Actual=' + $actualHash)
            }
            if ($unifiedPin.Groups[1].Value.ToLowerInvariant() -ne $actualHash) {
              throw ('Unified launcher pin mismatch. Actual=' + $actualHash + '; Unified=' + $unifiedPin.Groups[1].Value)
            }
            Write-Host ('Bootstrap pin verified across runtime and unified launcher: ' + $actualHash)
          }
          finally {
            if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          }

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained .NET 10 MCP host package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet --info
          dotnet publish runtime/McpHost/ResearchTools.McpHost.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output dist/mcp-host-win-x64
          if ($LASTEXITCODE -ne 0) { throw "MCP host publish failed: $LASTEXITCODE" }

          $exe = 'dist/mcp-host-win-x64/ResearchTools.McpHost.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Self-contained MCP host executable is missing.' }
          $exeHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath ($exe + '.sha256') -Value ($exeHash + '  ResearchTools.McpHost.exe') -Encoding ASCII

          $package = 'dist/mcp-host-package'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item -LiteralPath $exe -Destination $package
          Copy-Item -LiteralPath ($exe + '.sha256') -Destination $package
          Copy-Item -LiteralPath 'runtime/McpHost/Test-McpHost-Preview.ps1' -Destination $package
          Copy-Item -LiteralPath 'runtime/McpHost/Start-McpHost-Preview.ps1' -Destination $package
          $archive = 'dist/ResearchTools-MCP-Host-release.zip'
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $archive -CompressionLevel Optimal -Force
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath ($archive + '.sha256') -Value ($archiveHash + '  ResearchTools-MCP-Host-release.zip') -Encoding ASCII

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            $requiredEntries = @(
              'ResearchTools.McpHost.exe',
              'ResearchTools.McpHost.exe.sha256',
              'Test-McpHost-Preview.ps1',
              'Start-McpHost-Preview.ps1'
            )
            if ($names.Count -ne $requiredEntries.Count -or
                @($requiredEntries | Where-Object { $names -notcontains $_ }).Count -gt 0) {
              throw 'MCP host installer archive layout is invalid.'
            }
          }
          finally { $zip.Dispose() }
          Write-Host "MCP host published and checksummed: $exeHash; archive=$archiveHash"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $pf86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $compiler = Join-Path $pf86 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler unavailable.' }

      - name: Compile installer
        shell: pwsh
        run: |
          $pf86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $compiler = Join-Path $pf86 'Inno Setup 6\ISCC.exe'
          & $compiler 'installer/ResearchToolsSetup.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $setup = 'dist/ResearchTools-Setup.exe'
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw 'Setup EXE was not generated.' }
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath ($setup + '.sha256') -Value ($hash + '  ResearchTools-Setup.exe') -Encoding ASCII
          Write-Host "Built $setup, $((Get-Item $setup).Length) bytes, SHA256 $hash"

      - name: Upload unified Setup preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResearchTools-Unified-Setup
          path: |
            dist/ResearchTools-Setup.exe
            dist/ResearchTools-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseVersion = '1.2.10'
          $tag = "researchtools-setup-v$releaseVersion"
          $title = "ResearchTools Unified Setup v$releaseVersion"
          $notes = 'Unified Setup v1.2.10 fixes Aljam3 page-reference verification: the host records exact file_id/page_number pairs returned by search, authorizes only matching get_page calls, verifies the returned page identity, and no longer mistakes the search-hit id for file_id. Shamela book_id/page_id provenance validation remains intact. Adds regression coverage for exact matches, mismatched and cross-hit references, and opened-page identity. All 147 MCP host unit tests pass. CI also validates the Windows x64 host build, PowerShell 5.1 scripts, and discovery of both official read-only MCP catalogs with valid initial search plans. Preserves the DuckAI research protocol, source selection, SHA-256 verification, staged installation and rollback protections. Does not modify C:\\Word AI Assistant v2.'
          Set-Content -LiteralPath 'release-notes.txt' -Value $notes -Encoding UTF8
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/ResearchTools-Setup.exe dist/ResearchTools-Setup.exe.sha256 --repo "$env:GITHUB_REPOSITORY" --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
            gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes-file 'release-notes.txt' --latest
          }
          else {
            gh release create $tag dist/ResearchTools-Setup.exe dist/ResearchTools-Setup.exe.sha256 --repo "$env:GITHUB_REPOSITORY" --title $title --notes-file 'release-notes.txt' --target main --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed.' }
          Write-Host "Published https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
)
          if (-not $hostVersionMatch.Success -or -not $setupVersionMatch.Success -or -not $workflowVersionMatch.Success) {
            throw 'Could not read MCP host, Inno Setup and release workflow versions.'
          }
          $hostVersion = $hostVersionMatch.Groups['version'].Value
          $setupVersion = $setupVersionMatch.Groups['version'].Value
          $workflowVersion = $workflowVersionMatch.Groups['version'].Value
          if ($hostVersion -ne $setupVersion -or $hostVersion -ne $workflowVersion) {
            throw "Version mismatch: MCP host=$hostVersion; Setup=$setupVersion; release=$workflowVersion."
          }
          Write-Host "MCP host, Setup executable and release tag are aligned at v$hostVersion."
          foreach ($required in @('ResearchTools-MCP-Host-release.zip','ResearchTools-Launcher.vbs','-McpHostArchive','-McpHostShaFile','-LauncherFile')) {
            if ($iss -notmatch [regex]::Escape($required)) { throw "Setup script does not embed $required." }
          }
          # Regression contract: the installer and Setup packager must require the
          # exact same MCP archive entries, and the ZIP entry count must derive
          # from that list rather than a stale hard-coded number.
          $installerScript = Get-Content 'installer/Install-ResearchTools.ps1' -Raw
          $installerFilesMatch = [regex]::Match(
            $installerScript,
            '(?s)\$requiredMcpFiles\s*=\s*@\((?<files>.*?)\)')
          if (-not $installerFilesMatch.Success) {
            throw 'Installer does not declare the required MCP archive file list.'
          }
          $installerFiles = @([regex]::Matches(
            $installerFilesMatch.Groups['files'].Value,
            "'([^']+)'") | ForEach-Object { $_.Groups[1].Value })

          $setupWorkflow = Get-Content '.github/workflows/build-researchtools-setup.yml' -Raw
          $packageFilesMatch = [regex]::Match(
            $setupWorkflow,
            '(?s)\$requiredEntries\s*=\s*@\((?<files>.*?)\)')
          if (-not $packageFilesMatch.Success) {
            throw 'Setup workflow does not declare the MCP package entry list.'
          }
          $packageFiles = @([regex]::Matches(
            $packageFilesMatch.Groups['files'].Value,
            "'([^']+)'") | ForEach-Object { $_.Groups[1].Value })

          $expectedMcpFiles = @(
            'ResearchTools.McpHost.exe',
            'ResearchTools.McpHost.exe.sha256',
            'Test-McpHost-Preview.ps1',
            'Start-McpHost-Preview.ps1'
          )
          if (@(Compare-Object $expectedMcpFiles $installerFiles).Count -gt 0) {
            throw 'Installer MCP archive file list differs from the four required package files.'
          }
          if (@(Compare-Object $expectedMcpFiles $packageFiles).Count -gt 0) {
            throw 'Setup package MCP archive file list differs from the four required package files.'
          }
          if ($installerScript -notmatch '(?s)\$zip\.Entries\.Count\s*-ne\s*\$requiredMcpFiles\.Count') {
            throw 'Installer MCP archive entry count is not derived from requiredMcpFiles.Count.'
          }

          Write-Host 'PowerShell 5.1, Word manifest, unified launcher, Setup inputs and MCP archive contract validated.'

      - name: Download and verify embedded runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          gh release download duckai-runtime-v1.0.6 --repo "$env:GITHUB_REPOSITORY" --pattern "DuckAI-Runtime-release.zip" --dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Runtime download failed.' }
          gh release download duckai-runtime-v1.0.6 --repo "$env:GITHUB_REPOSITORY" --pattern "DuckAI-Runtime-release.zip.sha256" --dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Runtime checksum download failed.' }
          $sidecar = Get-Content 'dist/DuckAI-Runtime-release.zip.sha256' -Raw
          if ($sidecar -notmatch '(?i)^\s*([a-f0-9]{64})\s+DuckAI-Runtime-release\.zip\s*$') { throw 'Invalid runtime checksum file.' }
          $expected = $matches[1].ToUpperInvariant()
          $actual = (Get-FileHash 'dist/DuckAI-Runtime-release.zip' -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actual -ne $expected) { throw 'Embedded runtime SHA-256 mismatch.' }
          Write-Host "Runtime verified: $actual"

      - name: Validate DuckAI bootstrap pin across bundled components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $stage = 'dist/runtime-pin-check'
          if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          try {
            [IO.Compression.ZipFile]::ExtractToDirectory('dist/DuckAI-Runtime-release.zip', $stage)
            $bootstrap = Join-Path $stage 'DuckAI-Bootstrap.ps1'
            $runtimeLauncher = Join-Path $stage 'ResearchTools-Launcher.vbs'
            if (-not (Test-Path -LiteralPath $bootstrap -PathType Leaf) -or -not (Test-Path -LiteralPath $runtimeLauncher -PathType Leaf)) {
              throw 'Bundled DuckAI package is missing its bootstrap or launcher.'
            }
            $actualHash = (Get-FileHash -LiteralPath $bootstrap -Algorithm SHA256).Hash.ToLowerInvariant()
            $pattern = 'Const\s+BOOTSTRAP_SHA256\s*=\s*"([a-f0-9]{64})"'
            $runtimePin = [regex]::Match((Get-Content -LiteralPath $runtimeLauncher -Raw), $pattern)
            $unifiedPin = [regex]::Match((Get-Content -LiteralPath 'installer/ResearchTools-Launcher.vbs' -Raw), $pattern)
            if (-not $runtimePin.Success) { throw 'Could not read the bootstrap pin from the bundled DuckAI launcher.' }
            if (-not $unifiedPin.Success) { throw 'Could not read the bootstrap pin from the unified launcher.' }
            if ($runtimePin.Groups[1].Value.ToLowerInvariant() -ne $actualHash) {
              throw ('Bundled DuckAI launcher pin mismatch. Actual=' + $actualHash)
            }
            if ($unifiedPin.Groups[1].Value.ToLowerInvariant() -ne $actualHash) {
              throw ('Unified launcher pin mismatch. Actual=' + $actualHash + '; Unified=' + $unifiedPin.Groups[1].Value)
            }
            Write-Host ('Bootstrap pin verified across runtime and unified launcher: ' + $actualHash)
          }
          finally {
            if (Test-Path -LiteralPath $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
          }

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained .NET 10 MCP host package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet --info
          dotnet publish runtime/McpHost/ResearchTools.McpHost.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output dist/mcp-host-win-x64
          if ($LASTEXITCODE -ne 0) { throw "MCP host publish failed: $LASTEXITCODE" }

          $exe = 'dist/mcp-host-win-x64/ResearchTools.McpHost.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Self-contained MCP host executable is missing.' }
          $exeHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath ($exe + '.sha256') -Value ($exeHash + '  ResearchTools.McpHost.exe') -Encoding ASCII

          $package = 'dist/mcp-host-package'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item -LiteralPath $exe -Destination $package
          Copy-Item -LiteralPath ($exe + '.sha256') -Destination $package
          Copy-Item -LiteralPath 'runtime/McpHost/Test-McpHost-Preview.ps1' -Destination $package
          Copy-Item -LiteralPath 'runtime/McpHost/Start-McpHost-Preview.ps1' -Destination $package
          $archive = 'dist/ResearchTools-MCP-Host-release.zip'
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $archive -CompressionLevel Optimal -Force
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath ($archive + '.sha256') -Value ($archiveHash + '  ResearchTools-MCP-Host-release.zip') -Encoding ASCII

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            $requiredEntries = @(
              'ResearchTools.McpHost.exe',
              'ResearchTools.McpHost.exe.sha256',
              'Test-McpHost-Preview.ps1',
              'Start-McpHost-Preview.ps1'
            )
            if ($names.Count -ne $requiredEntries.Count -or
                @($requiredEntries | Where-Object { $names -notcontains $_ }).Count -gt 0) {
              throw 'MCP host installer archive layout is invalid.'
            }
          }
          finally { $zip.Dispose() }
          Write-Host "MCP host published and checksummed: $exeHash; archive=$archiveHash"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $pf86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $compiler = Join-Path $pf86 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler unavailable.' }

      - name: Compile installer
        shell: pwsh
        run: |
          $pf86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $compiler = Join-Path $pf86 'Inno Setup 6\ISCC.exe'
          & $compiler 'installer/ResearchToolsSetup.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          $setup = 'dist/ResearchTools-Setup.exe'
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw 'Setup EXE was not generated.' }
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath ($setup + '.sha256') -Value ($hash + '  ResearchTools-Setup.exe') -Encoding ASCII
          Write-Host "Built $setup, $((Get-Item $setup).Length) bytes, SHA256 $hash"

      - name: Upload unified Setup preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResearchTools-Unified-Setup
          path: |
            dist/ResearchTools-Setup.exe
            dist/ResearchTools-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'researchtools-setup-v1.2.9'
          $title = 'ResearchTools Unified Setup v1.2.9'
          $notes = 'Corrected one-file x64 installer v1.2.9. Replaces the unsupported DuckAI response_format=json_schema research path with a validated prompt-guided JSON decision protocol. The local MCP host constructs and executes the first search in every user-selected source from the live MCP inputSchema, verifies the real search schemas in diagnostics, and fails closed if any selected source is unavailable or lacks safe query arguments. It exposes live input schemas to the model for follow-up page reads and tells the model that remote MCP servers are already connected through the local host. The preview test requires successful search calls from every selected source. The MCP archive entry-count check is now derived from the same four-file required-entry list used for content validation, preventing a mismatch between the Setup packager and installer. Existing evidence provenance still requires verified same-source page opens before citing results. Preserves read-only MCP servers, source selection, DuckAI architecture, SHA-256 verification, staged installation and rollback protections. Does not modify C:\\Word AI Assistant v2.'
          Set-Content -LiteralPath 'release-notes.txt' -Value $notes -Encoding UTF8
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/ResearchTools-Setup.exe dist/ResearchTools-Setup.exe.sha256 --repo "$env:GITHUB_REPOSITORY" --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
            gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --title $title --notes-file 'release-notes.txt' --latest
          }
          else {
            gh release create $tag dist/ResearchTools-Setup.exe dist/ResearchTools-Setup.exe.sha256 --repo "$env:GITHUB_REPOSITORY" --title $title --notes-file 'release-notes.txt' --target main --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed.' }
          Write-Host "Published https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
