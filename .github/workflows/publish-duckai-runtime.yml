name: Build and publish DuckAI Runtime

on:
  push:
    branches:
      - main
    paths:
      - 'runtime/**'
      - '.github/workflows/publish-duckai-runtime.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'runtime/**'
      - '.github/workflows/publish-duckai-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: duckai-runtime-release
  cancel-in-progress: false

jobs:
  validate-windows-powershell-51:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            "runtime/Apply-DuckAI-AutoRepair.ps1",
            "runtime/DuckAI-Bootstrap.ps1",
            "runtime/DuckAI-MCP-Bridge.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Error ("{0}:{1}: {2}" -f $path, $_.Extent.StartLineNumber, $_.Message)
              }
              throw "Windows PowerShell 5.1 parse failed: $path"
            }
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path))
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              throw "UTF-8 BOM missing: $path"
            }
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "runtime/DuckAI-MCP-Bridge.ps1" -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "DuckAI MCP bridge self-tests failed." }
          & cscript.exe //nologo "runtime/DuckAI-Update.vbs" --self-test
          if ($LASTEXITCODE -ne 0) { throw "DuckAI one-click updater VBScript validation failed." }
          Write-Host "Windows PowerShell 5.1 parsing, BOM and MCP bridge self-tests passed."

  build-and-release:
    needs: validate-windows-powershell-51
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate PowerShell syntax and integrity pins
        shell: pwsh
        run: |
          $scriptPaths = @(
            "runtime/Apply-DuckAI-AutoRepair.ps1",
            "runtime/DuckAI-Bootstrap.ps1",
            "runtime/DuckAI-MCP-Bridge.ps1"
          )
          foreach ($scriptPath in $scriptPaths) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $scriptPath),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object {
                Write-Error ("{0}:{1}: {2}" -f $scriptPath, $_.Extent.StartLineNumber, $_.Message)
              }
              throw "PowerShell syntax validation failed: $scriptPath"
            }
          }

          $launcherHash = (Get-FileHash "runtime/ResearchTools-Launcher.vbs" -Algorithm SHA256).Hash.ToLowerInvariant()
          $bootstrapHash = (Get-FileHash "runtime/DuckAI-Bootstrap.ps1" -Algorithm SHA256).Hash.ToLowerInvariant()
          $launcherText = Get-Content "runtime/ResearchTools-Launcher.vbs" -Raw
          $installerText = Get-Content "runtime/Apply-DuckAI-AutoRepair.ps1" -Raw
          Write-Host ("CI launcher SHA-256: " + $launcherHash)
          Write-Host ("CI bootstrap SHA-256: " + $bootstrapHash)
          Write-Host ("Launcher pinned bootstrap SHA-256: " + ([regex]::Match($launcherText, 'Const BOOTSTRAP_SHA256 = "([a-f0-9]{64})"').Groups[1].Value))
          Write-Host ("Installer SHA-256 pins: " + (([regex]::Matches($installerText, "Sha256 = '([a-f0-9]{64})'") | ForEach-Object { $_.Groups[1].Value }) -join ','))
          if (-not $launcherText.Contains($bootstrapHash)) {
            throw "Launcher bootstrap SHA-256 pin does not match the bootstrap file."
          }
          $pins = [regex]::Matches($installerText, "Sha256 = '([a-f0-9]{64})'") | ForEach-Object { $_.Groups[1].Value }
          if ($pins.Count -ne 2 -or $pins[0] -ne $launcherHash -or $pins[1] -ne $bootstrapHash) {
            throw "Installer SHA-256 pins do not match the launcher and bootstrap files."
          }
          & pwsh -NoProfile -File "runtime/DuckAI-MCP-Bridge.ps1" -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "DuckAI MCP bridge self-tests failed." }
          $bootstrapText = Get-Content "runtime/DuckAI-Bootstrap.ps1" -Raw
          $launcherText = Get-Content "runtime/ResearchTools-Launcher.vbs" -Raw
          $updateText = Get-Content "runtime/DuckAI-Update.vbs" -Raw
          if (-not $bootstrapText.Contains('[switch]$CheckForUpdates') -or -not $bootstrapText.Contains("DuckAI-Installed-Release.txt")) {
            throw "Runtime release-version update check is missing."
          }
          if (-not $launcherText.Contains("BridgeListening()") -or -not $launcherText.Contains("/ping") -or -not $launcherText.Contains("MCP bridge is listening")) {
            throw "Launcher MCP readiness probe is missing."
          }
          if (-not $updateText.Contains("/releases?per_page=100") -or -not $updateText.Contains("duckai-runtime-v")) {
            throw "One-click updater must filter the repository release list to stable DuckAI runtime tags."
          }
          if (-not $bootstrapText.Contains("/releases?per_page=100") -or -not $bootstrapText.Contains("duckai-runtime-v")) {
            throw "Runtime bootstrap must filter the repository release list to stable DuckAI runtime tags."
          }
          if (-not $launcherText.Contains("WaitForDuckApi(120)") -or -not $launcherText.Contains("/v1/models") -or -not $launcherText.Contains("DuckAPI did not return")) {
            throw "Launcher Duck2API readiness gate is missing."
          }
          $waitIndex = $launcherText.IndexOf("If Not WaitForDuckApi(120) Then")
          $agentIndex = $launcherText.IndexOf('shell.Run Chr(34)&agentExe&Chr(34),0,False')
          if ($waitIndex -lt 0 -or $agentIndex -lt 0 -or $waitIndex -gt $agentIndex) {
            throw "Research agent must not start before Duck2API /v1/models is ready."
          }
          Write-Host "PowerShell syntax, MCP bridge self-tests, runtime-release filtering, Duck2API readiness ordering and integrity pins passed."

      - name: Download verified v1.0.0 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/duckai-base" dist
          gh release download duckai-runtime-v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "DuckAI-Runtime-release.zip" \
            --dir "$RUNNER_TEMP/duckai-base"

      - name: Build runtime and one-time repair package
        run: |
          python runtime/build_runtime_release.py \
            --input "$RUNNER_TEMP/duckai-base/DuckAI-Runtime-release.zip" \
            --runtime-dir runtime \
            --output dist/DuckAI-Runtime-release.zip

          python - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path

          root = Path("runtime")
          output = Path("dist/DuckAI-AutoRepair-Installer.zip")
          entries = [
              "Apply-DuckAI-AutoRepair.ps1",
              "Install-DuckAI-AutoRepair.vbs",
              "تعليمات-الاستعادة.txt",
          ]
          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in entries:
                  path = root / name
                  if not path.is_file():
                      raise SystemExit(f"Missing repair installer file: {path}")
                  archive.write(path, arcname=name)

          for path in sorted(Path("dist").glob("*.zip")):
              digest = hashlib.sha256(path.read_bytes()).hexdigest().upper()
              path.with_suffix(path.suffix + ".sha256").write_text(
                  f"{digest}  {path.name}\n", encoding="ascii"
              )
          PY

      - name: Publish stable runtime release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="duckai-runtime-v1.0.11"
          TITLE="DuckAI Runtime v1.0.11"
          NOTES="$RUNNER_TEMP/duckai-release-notes.md"
          cat > "$NOTES" <<'EOF'
          يتضمن هذا الإصدار آلية التشغيل المحلي الصامت والاستعادة الذاتية لـ DuckAI، مع وسيط MCP محلي يربط Luna بخوادم المكتبات.

          - يفحص المشغّل أحدث إصدار مستقر من DuckAI فقط، مع استبعاد إصدارات Setup الأخرى من قائمة إصدارات GitHub.
          - ينزّل الإصدار الأحدث عند توفره، ويتحقق من بصمة SHA-256 قبل التثبيت، مع الاستمرار بالنسخة المحلية السليمة عند تعذر الاتصال بـ GitHub.
          - ينتظر المشغّل استجابة HTTP 200 وقائمة نماذج غير فارغة من Duck2API على 127.0.0.1:18080/v1/models قبل تشغيل وكيل البحث، بمهلة إقلاع مستقلة تصل إلى 120 ثانية.
          - يتحقق المشغّل من استجابة جسر MCP فعلياً على 127.0.0.1:18081، ويعيد تشغيله عند توقف الاستماع.
          - يوفر ملف DuckAI-Update.vbs مستقلاً لفحص التحديثات وتنزيلها وتثبيتها بالنقر المزدوج، مع رسالة نتيجة وسجل تشخيص.
          - يتحقق من بصمة SHA-256 التي يوفرها GitHub ومن البصمات الداخلية قبل التثبيت.
          - يتحقق من إنشاء مهمة التشغيل التلقائي ومسار المشغّل قبل إعلان نجاح التهيئة.
          - يسجل بداية التهيئة ورمز خروج كل مرحلة لتسهيل تشخيص الفشل دون إظهار نوافذ.
          - يحتفظ بالمشغّل وملف الاستعادة خارج مجلد المحرك حتى تبقى نقطة الاستعادة متاحة.
          - يعيد استخدام مهمة Windows الحالية ResearchTools DuckAI Agent دون إنشاء مهمة إضافية.
          - يشغل وسيط MCP محلياً على 127.0.0.1:18081 دون كشفه على الشبكة.
          - يوجه طلبات البحث إلى DuckAI المحلي، ويكتشف أدوات الجامع والمكتبة الشاملة الرسمية عبر MCP.
          - يستخدم طلب البحث المحلي POST بسيطاً متوافقاً مع CORS دون ترويسات مخصصة تفرض preflight، مع قصر التنفيذ على أصل أدوات الباحث وعلامة العميل داخل الحمولة.
          - يتصل بالمكتبة الشاملة الرسمية عبر https://mcp.shamela.ws للقراءة فقط دون رمز OAuth أو مفتاح API، باستخدام دورة تهيئة MCP القياسية.
          - يتحقق من اسم الأداة ومخطط مدخلاتها ويضع حداً أقصى لعدد الاستدعاءات في المهمة الواحدة.

          يحتوي الإصدار كذلك على ملف DuckAI-AutoRepair-Installer.zip لتهيئة الأجهزة القديمة، وملف DuckAI-Update.vbs للتحديث والصيانة بنقرة واحدة.
          EOF

          ASSETS=(
            "dist/DuckAI-Runtime-release.zip"
            "dist/DuckAI-Runtime-release.zip.sha256"
            "dist/DuckAI-AutoRepair-Installer.zip"
            "dist/DuckAI-AutoRepair-Installer.zip.sha256"
            "runtime/DuckAI-Update.vbs"
          )

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --target main \
              --latest
          fi
