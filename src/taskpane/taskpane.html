<!-- =========================================
     MAIN
     ========================================= -->

<div class="main">


    <!-- عنوان المستند -->

    <div id="document-title">

        لا يوجد مستند مفتوح

    </div>


    <!-- =====================================
        REFERENCES WORKSPACE
        مساحة عمل المراجع
        ===================================== -->

    <div
        id="references-workspace"
        class="references-workspace">

        <div class="references-header">

            <div class="references-header-title">

                <span class="references-header-icon">

                    <svg xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="#000000"
                        stroke-width="1"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true">

                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>

                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>

                    </svg>

                </span>

                <div>

                    <div class="references-title">
                        المراجع
                    </div>

                    <div class="references-subtitle">
                        معالجة مراجع المستندات والمشاريع
                    </div>

                </div>

            </div>


            <button
                id="close-references"
                class="close-references"
                type="button"
                aria-label="إغلاق المراجع"
                title="إغلاق">

                ×

            </button>

        </div>


        <div
            id="references-content"
            class="references-content">

            <div class="references-source-panel">

                <div class="references-source-heading">
                    مصدر العمل
                </div>

                <div class="references-source-options">

                    <button
                        type="button"
                        class="references-source-option"
                        data-reference-source="current-document">

                        <div class="references-selected-icon">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="#000000"
                                stroke-width="1"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true">

                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>

                                <polyline points="14 2 14 8 20 8"/>

                                <line x1="8" y1="13" x2="16" y2="13"/>

                                <line x1="8" y1="17" x2="16" y2="17"/>

                                <line x1="8" y1="9" x2="10" y2="9"/>

                            </svg>

                        </div>

                        <span class="references-source-info">

                            <span class="references-source-title">
                                المستند الحالي
                            </span>

                            <span class="references-source-description">
                                العمل على مراجع المستند المفتوح حاليًا
                            </span>

                        </span>

                    </button>


                    <button
                        type="button"
                        class="references-source-option"
                        data-reference-source="project-documents">

                        <span class="references-source-icon">

                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="#000000"
                                stroke-width="1"
                                stroke-linecap="round"
                                stroke-linejoin="round">

                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>

                            </svg>

                        </span>

                        <span class="references-source-info">

                            <span class="references-source-title">
                                مستندات المشروع
                            </span>

                            <span class="references-source-description">
                                العمل على مراجع مستندات المشروع
                            </span>

                        </span>

                    </button>

                </div>

            </div>

            <div
                id="references-source-workspace"
                class="references-source-workspace">
            </div>

        </div>

    </div>

    <!-- =====================================
         CHAT AREA
         ===================================== -->

    <div id="chat-area">


        <div class="welcome">


            <div class="ai-symbol">

                ✦

            </div>


            <h2>

                مرحبًا بك

            </h2>


            <p>

                ابدأ محادثة جديدة

            </p>


        </div>


    </div>



    <!-- =====================================
         INPUT AREA
         ===================================== -->
 
        <div class="input-area">

            <div
                id="scope-status"
                class="scope-status">

                <span
                    id="scope-label"
                    class="scope-label">
                </span>

                <button
                    id="scope-clear"
                    class="scope-clear"
                    type="button"
                    aria-label="إلغاء نطاق البحث"
                    title="إلغاء نطاق البحث">
                    ×
                </button>

            </div>

            <div class="message-box">

                <div class="input-tools">

                    <button
                        id="scope-btn"
                        type="button"
                        aria-label="تحديد نطاق البحث"
                        title="تحديد نطاق البحث">
                        +
                    </button>


                </div>

                <textarea
                    id="user-input"
                    placeholder="اكتب سؤالك هنا..."
                    rows="1"></textarea>

                <button
                    id="send-btn"
                    type="button"
                    aria-label="إرسال">

                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 19V5"></path>
                        <path d="M6 11l6-6 6 6"></path>
                    </svg>

                </button>

            </div>

                        <div
                id="scope-panel"
                class="scope-panel"
                aria-hidden="true">

                <div class="scope-panel-header">
                    <span class="scope-panel-title">
                        نطاق البحث
                    </span>
                </div>

                <div class="scope-panel-content">

                    <button
                        type="button"
                        class="scope-option"
                        data-scope-type="project">

                        <span class="scope-option-icon">

                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="#000000"
                                stroke-width="1"
                                stroke-linecap="round"
                                stroke-linejoin="round">

                                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>

                            </svg>

                        </span>

                        <span class="scope-option-text">
                            المشاريع
                        </span>

                    </button>


                    <button
                        type="button"
                        class="scope-option"
                        data-scope-type="document">

                        <span class="scope-option-icon">

                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="#000000"
                                stroke-width="1"
                                stroke-linecap="round"
                                stroke-linejoin="round">

                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                <polyline points="14 2 14 8 20 8"/>
                                <line x1="8" y1="13" x2="16" y2="13"/>
                                <line x1="8" y1="17" x2="16" y2="17"/>
                                <line x1="8" y1="9" x2="10" y2="9"/>

                            </svg>

                        </span>

                        <span class="scope-option-text">
                            المستندات
                        </span>

                    </button>


                    <button
                        type="button"
                        class="scope-option"
                        data-scope-type="reference">

                        <span class="scope-option-icon">

                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="#000000"
                                stroke-width="1"
                                stroke-linecap="round"
                                stroke-linejoin="round">

                                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 6.5 2z"/>

                            </svg>

                        </span>

                        <span class="scope-option-text">
                            المراجع
                        </span>

                    </button>


                    <button
                        type="button"
                        class="scope-option"
                        data-scope-type="library">

                        <span class="scope-option-icon">

                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="#000000"
                                stroke-width="1"
                                stroke-linecap="round"
                                stroke-linejoin="round">

                                <rect
                                    x="4"
                                    y="5"
                                    width="4.5"
                                    height="14"
                                    rx="1.5"
                                />

                                <rect
                                    x="9.5"
                                    y="5"
                                    width="4.5"
                                    height="14"
                                    rx="1.5"
                                />

                                <rect
                                    x="15.5"
                                    y="5"
                                    width="4.5"
                                    height="14"
                                    rx="1.5"
                                    transform="rotate(-5, 17.75, 12)"
                                />

                            </svg>

                        </span>

                        <span class="scope-option-text">
                            المكتبة
                        </span>

                    </button>

                </div>

            </div>

        </div>





<!-- =========================================
     CHAT POPUP
     ========================================= -->

<div id="chat-popup">


    <div class="chat-popup-header">

        المحادثات

    </div>



    <div id="recent-chat-list">

    </div>


</div>



<!-- =========================================

<div class="search-popup"

    <div id="search-results">

    </div>


</div>



<!-- =========================================

     ========================================= -->

<div class="projects-popup"

    <!-- رأس نافذة المشاريع -->

    <div class="projects-header">

    <span>

        <svg xmlns="http://www.w3.org/2000/svg"

             stroke="#000000"
             stroke-width="1"
             stroke-linecap="round"

        </svg>

        المشاريع

    </span>

    <button
        id="new-project-btn"
        type="button"
        title="مشروع جديد">

        ＋

    </button>

</div>



    <!-- قائمة المشاريع -->

    <div id="projects-list">

    </div>


</div>




<!-- =====================================
     نافذة إعدادات الذكاء الاصطناعي
     ===================================== -->

<div id="settings-window">


    <!-- رأس الإعدادات -->

    <div id="settings-header">

        <span>
    <svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     fill="none"
     stroke="#000000"
     stroke-width="1"
     stroke-linecap="round"

    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
</svg>
    إعدادات الذكاء الاصطناعي
</span>


        <button
            id="close-settings"
            type="button"
            title="إغلاق">

            ×

        </button>

    </div>


    <!-- =================================
         مزود الذكاء الاصطناعي
         ================================= -->

    <label for="provider-select">

        مزود الذكاء الاصطناعي

    </label>


    <select id="provider-select">

        <option value="openrouter">
            OpenRouter
        </option>

        <option value="openai">
            OpenAI
        </option>

        <option value="gemini">
            Gemini
        </option>

        <option value="groq">
            Groq
        </option>

    </select>


    <!-- =================================
         مفتاح API
         ================================= -->

    <label for="api-key">

        مفتاح API

    </label>


    <div class="key-box">

        <input
            id="api-key"
            type="password"
            placeholder="أدخل مفتاح API"
            autocomplete="off">


        <button
            id="show-key"
            type="button"
            title="إظهار المفتاح">

            👁

        </button>

    </div>


    <!-- =================================
         النماذج
         ================================= -->

    <label for="model-select">

        النموذج

    </label>


    <div class="model-box">

        <select id="model-select">

            <option value="">

                أدخل المفتاح ثم حدّث النماذج

            </option>

        </select>


        <button
            id="refresh-models"
            type="button"
            title="تحديث النماذج">

            ↻

        </button>

    </div>


    <!-- =================================
         عناصر توافق JavaScript
         مخفية ولا تؤثر على التصميم
         ================================= -->

    <input
        id="model-name"
        type="hidden"
        value="">


    <input
        id="api-url"
        type="hidden"
        value="">


    <div
        id="custom-url-section"
        style="display:none;">

    </div>


    <!-- =================================
         معلومات الاتصال
         ================================= -->

    <div id="provider-info">

        سيتم تحديد رابط الاتصال تلقائيًا
        حسب مزود الذكاء الاصطناعي.

    </div>


    <!-- =================================
         أزرار الإعدادات
         ================================= -->

    <div class="settings-buttons">

        <button
            id="test-connection"
            type="button">

            اختبار الاتصال

        </button>


        <button
            id="save-settings"
            type="button">

            حفظ

        </button>

    </div>


    <!-- =================================
         حالة الإعدادات
         ================================= -->

    <div id="settings-status">

    </div>


</div>

     <script type="module">
    import {
        create,
        insert,
        insertMultiple,
        search
    } from "https://cdn.jsdelivr.net/npm/@orama/orama@3.1.18/+esm";

    import {
