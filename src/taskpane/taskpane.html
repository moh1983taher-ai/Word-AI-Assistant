<!-- =========================================
     Word AI Assistant - Task Pane
     ========================================= -->

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Word AI Assistant</title>

    <link rel="stylesheet"
          href="taskpane.css">

    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    

</head>


<body>


<!-- =========================================
     SIDEBAR
     ========================================= -->

<div class="sidebar">

<button id="pin-sidebar" class="side-icon" title="تثبيت الشريط">
    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="1"
         stroke-linecap="round"
         stroke-linejoin="round"
         aria-hidden="true">
        <line x1="12" x2="12" y1="17" y2="22"/>
        <path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/>
    </svg>
</button>
    <!-- الشعار -->

    <div class="brand-icon"
         title="Word AI Assistant">

        ✦

    </div>



    <!-- زر إظهار وإخفاء القائمة -->

    <button
        class="side-icon"
        id="sidebar-toggle-btn"
        title="إظهار القائمة">

        <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true">

        <rect
            x="3"
            y="3"
            width="18"
            height="18"
            rx="4"
            ry="4">
        </rect>

            <line
                x1="9"
                y1="3"
                x2="9"
                y2="21">
            </line>

        </svg>

    </button>



    <!-- =====================================
         Sidebar Top
         ===================================== -->

    <div class="sidebar-top">


        <button class="side-icon"
        id="new-chat-btn"
        title="محادثة جديدة">

    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 24 24"
         fill="none"
         stroke="#000000"
         stroke-width="1"
         stroke-linecap="round"
         stroke-linejoin="round"
         aria-hidden="true">

        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/>

    </svg>

</button>


        
<!-- المحادثات -->

<button class="side-icon"
        id="chat-btn"
        title="المحادثات">

    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 24 24"
         fill="none"
         stroke="#000000"
         stroke-width="1"
         stroke-linecap="round"
         stroke-linejoin="round"
         aria-hidden="true">

        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>

    </svg>

</button>



        <!-- المشاريع -->

        <button class="side-icon"
        id="projects-btn"
        title="المشاريع">

    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 24 24"
         fill="none"
         stroke="#000000"
         stroke-width="1"
         stroke-linecap="round"
         stroke-linejoin="round"
         aria-hidden="true">

        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>

    </svg>

</button>



        <!-- المستندات -->

        <button class="side-icon"
        id="files-btn"
        title="المستندات">

    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 24 24"
         fill="none"
         stroke="#000000"
         stroke-width="1"
         stroke-linecap="round"
         stroke-linejoin="round"
         aria-hidden="true">

        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="8" y1="13" x2="16" y2="13"/>
        <line x1="8" y1="17" x2="16" y2="17"/>
        <line x1="8" y1="9" x2="10" y2="9"/>

    </svg>

</button>



        <!-- البحث -->

        <button class="side-icon"
        id="search-btn"
        title="البحث">

    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 24 24"
         fill="none"
         stroke="#000000"
         stroke-width="1"
         stroke-linecap="round"
         stroke-linejoin="round"
         aria-hidden="true">

        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>

    </svg>

</button>


    </div>



    <!-- =====================================
         Sidebar Bottom
         ===================================== -->

    <div class="sidebar-bottom">


        <!-- الإعدادات -->

        <button class="side-icon" id="settings-btn" title="الإعدادات">
    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 24 24"
         fill="none"
         stroke="#000000"
         stroke-width="1"
         stroke-linecap="round"
         stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
        </button>



        <!-- الوضع الليلي -->

        <button class="side-icon"
        id="theme-btn"
        title="الوضع الليلي">

    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 24 24"
         fill="none"
         stroke="#000000"
         stroke-width="1"
         stroke-linecap="round"
         stroke-linejoin="round"
         aria-hidden="true">

        <path d="M21 12.79A9 9 0 1 1 11.21 3
                 7 7 0 0 0 21 12.79z"/>

    </svg>

</button>



        <!-- المساعدة -->

        <button class="side-icon"
                id="help-btn"
                title="المساعدة">

            ?

        </button>


    </div>


</div>



<!-- =====================================
     Expanded Sidebar Content
     ===================================== -->

<div id="expanded-sidebar">

    <!-- عنوان القائمة -->
    <div class="expand-header">

    <span>
        أدوات الباحث
    </span>

    <div id="expanded-sidebar-toggle-slot"></div>

    </div>


    <!-- =====================================
         محادثة جديدة
         ===================================== -->

    <div class="expand-item section-toggle"
         data-target="new-chat-list">

        <span class="section-arrow">›</span>

        <span>
            محادثة جديدة
        </span>

    </div>

    <div id="new-chat-list"
         class="section-content">
    </div>


    <!-- =====================================
         المحادثات
         ===================================== -->

    <div class="expand-item section-toggle"
         data-target="chat-list-section">

        <span class="section-arrow">›</span>

        <span>
            المحادثات
        </span>

    </div>

    <div id="chat-list-section"
         class="section-content">

        <div id="chat-list"></div>

    </div>


    <!-- =====================================
         المشاريع
         ===================================== -->

    <div class="expand-item section-toggle"
         id="expanded-projects"
         data-target="projects-section">

        <span class="section-arrow"
              id="expanded-projects-arrow">›</span>

        <span>
            المشاريع
        </span>

    </div>

    <div id="projects-section"
         class="section-content">

        <div id="expanded-projects-list"></div>

    </div>


    <!-- =====================================
         المستندات
         ===================================== -->

    <div class="expand-item section-toggle"
         data-target="files-section">

        <span class="section-arrow">›</span>

        <span>
            المستندات
        </span>

    </div>

    <div id="files-section"
         class="section-content">

        <!-- محتوى المستندات يوضع هنا لاحقًا -->

    </div>


    <!-- =====================================
         المراجع
         ===================================== -->

    <div class="expand-item section-toggle"
         data-target="references-section">

        <span class="section-arrow">›</span>

        <span>
            المراجع
        </span>

    </div>

    <div id="references-section"
         class="section-content">

        <!-- محتوى المراجع يوضع هنا لاحقًا -->

    </div>

</div>

<!-- =========================================
     MAIN
     ========================================= -->

<div class="main">


    <!-- عنوان المستند -->

    <div id="document-title">

        لا يوجد مستند مفتوح

    </div>



    <!-- =====================================
         CHAT AREA
         ===================================== -->

    <div id="chat-area">


        <div class="welcome">


            <div class="ai-symbol">

                ✦

            </div>


            <h2>

                مرحبًا بك

            </h2>


            <p>

                ابدأ محادثة جديدة

            </p>


        </div>


    </div>



    <!-- =====================================
         INPUT AREA
         ===================================== -->
 
<div class="input-area">

    <div class="message-box">

        <textarea
            id="user-input"
            placeholder="اكتب سؤالك هنا..."
            rows="1"></textarea>

        <button
            id="send-btn"
            type="button"
            aria-label="إرسال">

            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 19V5"></path>
                <path d="M6 11l6-6 6 6"></path>
            </svg>

        </button>

    </div>

</div>





<!-- =========================================
     CHAT POPUP
     ========================================= -->

<div id="chat-popup">


    <div class="chat-popup-header">

        المحادثات

    </div>



    <div id="recent-chat-list">

    </div>


</div>



<!-- =========================================
     SEARCH POPUP
     ========================================= -->

<div class="search-popup"
     id="search-popup">


    <input
        id="search-input"
        type="text"
        placeholder="ابحث في المحادثات...">



    <div id="search-results">

    </div>


</div>



<!-- =========================================
     PROJECTS POPUP
     ========================================= -->

<div class="projects-popup"
     id="projects-popup">


    <!-- رأس نافذة المشاريع -->

    <div class="projects-header">

    <span>

        <svg xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 24 24"
             fill="none"
             stroke="#000000"
             stroke-width="1"
             stroke-linecap="round"
             stroke-linejoin="round"
             aria-hidden="true">

            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>

        </svg>

        المشاريع

    </span>

    <button
        id="new-project-btn"
        type="button"
        title="مشروع جديد">

        ＋

    </button>

</div>



    <!-- قائمة المشاريع -->

    <div id="projects-list">

    </div>


</div>




<!-- =====================================
     نافذة إعدادات الذكاء الاصطناعي
     ===================================== -->

<div id="settings-window">


    <!-- رأس الإعدادات -->

    <div id="settings-header">

        <span>
    <svg xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 24 24"
         fill="none"
         stroke="#000000"
         stroke-width="1"
         stroke-linecap="round"
         stroke-linejoin="round"
         width="16"
         height="16"
         aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
    إعدادات الذكاء الاصطناعي
</span>


        <button
            id="close-settings"
            type="button"
            title="إغلاق">

            ×

        </button>

    </div>


    <!-- =================================
         مزود الذكاء الاصطناعي
         ================================= -->

    <label for="provider-select">

        مزود الذكاء الاصطناعي

    </label>


    <select id="provider-select">

        <option value="openrouter">
            OpenRouter
        </option>

        <option value="openai">
            OpenAI
        </option>

        <option value="gemini">
            Gemini
        </option>

    </select>


    <!-- =================================
         مفتاح API
         ================================= -->

    <label for="api-key">

        مفتاح API

    </label>


    <div class="key-box">

        <input
            id="api-key"
            type="password"
            placeholder="أدخل مفتاح API"
            autocomplete="off">


        <button
            id="show-key"
            type="button"
            title="إظهار المفتاح">

            👁

        </button>

    </div>


    <!-- =================================
         النماذج
         ================================= -->

    <label for="model-select">

        النموذج

    </label>


    <div class="model-box">

        <select id="model-select">

            <option value="">

                أدخل المفتاح ثم حدّث النماذج

            </option>

        </select>


        <button
            id="refresh-models"
            type="button"
            title="تحديث النماذج">

            ↻

        </button>

    </div>


    <!-- =================================
         عناصر توافق JavaScript
         مخفية ولا تؤثر على التصميم
         ================================= -->

    <input
        id="model-name"
        type="hidden"
        value="">


    <input
        id="api-url"
        type="hidden"
        value="">


    <div
        id="custom-url-section"
        style="display:none;">

    </div>


    <!-- =================================
         معلومات الاتصال
         ================================= -->

    <div id="provider-info">

        سيتم تحديد رابط الاتصال تلقائيًا
        حسب مزود الذكاء الاصطناعي.

    </div>


    <!-- =================================
         أزرار الإعدادات
         ================================= -->

    <div class="settings-buttons">

        <button
            id="test-connection"
            type="button">

            اختبار الاتصال

        </button>


        <button
            id="save-settings"
            type="button">

            حفظ

        </button>

    </div>


    <!-- =================================
         حالة الإعدادات
         ================================= -->

    <div id="settings-status">

    </div>


</div>




<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<!-- =========================================
     JAVASCRIPT
     ========================================= -->

<script src="taskpane.js"></script>


</body>

</html>
